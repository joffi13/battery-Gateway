# Home Assistant package for battery-gateway MQTT API v1.
#
# This package is intentionally display-only. It consumes only public
# battery-gateway MQTT topics and does not calculate battery values in
# Home Assistant.
#
# Assumptions:
# - MQTT base topic: battery-gateway
# - Battery id: battery_01
# - MQTT API: v1
#
# Missing in MQTT API v1:
# - explicit availability/online topic
# - cell minimum and maximum topics
# - dynamic list of available temperature sensors

mqtt:
